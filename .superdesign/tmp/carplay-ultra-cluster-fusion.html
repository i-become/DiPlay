<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CarPlay Ultra · 融合仪表 1920×720</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    body{margin:0;font-family:"Segoe UI",-apple-system,"SF Pro Display","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
    .dial-face{
      background:radial-gradient(circle at 50% 38%,rgba(22,35,58,.97) 0%,rgba(8,12,22,.99) 58%,rgba(4,6,12,1) 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.14),
        0 0 0 3px rgba(0,0,0,.85),
        inset 0 2px 24px rgba(255,255,255,.06),
        inset 0 -20px 40px rgba(0,0,0,.55),
        0 24px 48px rgba(0,0,0,.45);
    }
    .dial-ring-glow{filter:drop-shadow(0 0 6px rgba(255,255,255,.25))}
    .map-perspective{
      background:
        radial-gradient(ellipse 120% 80% at 50% 100%,rgba(30,80,140,.35),transparent 55%),
        linear-gradient(180deg,#0a1424 0%,#0d1a2e 35%,#152238 100%);
    }
    .road-surface{
      background:linear-gradient(180deg,rgba(40,55,75,.2) 0%,rgba(28,38,52,.85) 45%,rgba(18,24,34,.95) 100%);
      transform:perspective(900px) rotateX(52deg);
      transform-origin:50% 0%;
    }
    .lane-line{background:repeating-linear-gradient(180deg,rgba(255,255,255,.55) 0 14px,transparent 14px 34px)}
    .glass-chip{
      background:rgba(12,22,38,.72);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 8px 32px rgba(0,0,0,.35);
    }
    .text-dial{font-variant-numeric:tabular-nums;letter-spacing:.02em}
    .arc-muted{fill:none;stroke:rgba(255,255,255,.12);stroke-width:5;stroke-linecap:round}
    .arc-fill-blue{fill:none;stroke:#4da3ff;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(77,163,255,.6))}
    .arc-fill-fuel{fill:none;stroke:#7dd957;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(125,217,87,.5))}
  </style>
</head>
<body>
<div id="screen-root" class="w-[1920px] h-[720px] relative overflow-hidden text-white select-none bg-[#060a12]">

  <!-- ═══ Layer 0: full-width navigation (extends under dials) ═══ -->
  <div class="absolute inset-0 map-perspective">
    <div class="absolute inset-x-[380px] top-[88px] bottom-[56px] overflow-hidden">
      <div class="absolute left-1/2 top-[8%] w-[920px] h-[520px] -translate-x-1/2 road-surface rounded-t-[40%]">
        <div class="absolute inset-y-0 left-[18%] w-[3px] lane-line opacity-40"></div>
        <div class="absolute inset-y-0 left-1/2 w-[4px] -translate-x-1/2 lane-line"></div>
        <div class="absolute inset-y-0 right-[18%] w-[3px] lane-line opacity-40"></div>
        <!-- route highlight -->
        <svg class="absolute inset-0 w-full h-full" viewBox="0 0 920 520" preserveAspectRatio="none">
          <path d="M460 500 L460 80" stroke="rgba(255,255,255,.08)" stroke-width="120" fill="none"/>
          <path d="M460 500 L460 120" stroke="#2563eb" stroke-width="72" fill="none" opacity=".85"/>
          <path d="M460 280 L580 180" stroke="#dc2626" stroke-width="48" fill="none" opacity=".75" stroke-linecap="round"/>
        </svg>
        <!-- maneuver arrow on road -->
        <div class="absolute left-1/2 top-[32%] -translate-x-1/2 flex flex-col items-center">
          <div class="text-[56px] font-light text-white drop-shadow-lg leading-none">↑</div>
          <div class="mt-1 px-3 py-1 rounded bg-white/90 text-[#111] text-[22px] font-semibold">25</div>
        </div>
      </div>
    </div>

    <!-- top status strip (center band) -->
    <div class="absolute top-[28px] left-[420px] right-[420px] flex items-center justify-center gap-10 text-[17px] text-white/75 text-dial">
      <span class="flex items-center gap-1.5"><iconify-icon icon="mdi:compass-outline"></iconify-icon>北</span>
      <span class="text-[20px] text-white font-medium">17:39</span>
      <span class="flex items-center gap-2">
        <span class="w-[38px] h-[38px] rounded-full border-2 border-white flex items-center justify-center text-[15px] font-semibold">50</span>
        <span class="text-white/50 text-[14px]">限速</span>
      </span>
      <span>25.0°C</span>
    </div>

    <!-- floating nav cards -->
    <div class="absolute top-[100px] left-[520px] glass-chip rounded-lg px-4 py-2.5 text-[15px] text-white/90 max-w-[420px]">
      <div class="text-white/55 text-[13px] mb-0.5">目的地</div>
      北京市 · 首都国际机场 T3
    </div>
    <div class="absolute top-[100px] right-[520px] flex gap-3">
      <div class="glass-chip rounded-lg px-5 py-2.5 text-center min-w-[100px]">
        <div class="text-[28px] font-semibold text-dial leading-none">18:17</div>
        <div class="text-[12px] text-white/45 mt-1">预计到达</div>
      </div>
      <div class="glass-chip rounded-lg px-5 py-2.5 text-center min-w-[100px]">
        <div class="text-[28px] font-semibold text-dial leading-none">18<span class="text-[16px] text-white/50 font-normal"> km</span></div>
        <div class="text-[12px] text-white/45 mt-1">剩余</div>
      </div>
    </div>
    <div class="absolute top-[200px] left-[640px] glass-chip rounded-md px-4 py-2 flex items-center gap-3 border-red-500/40 bg-red-950/50">
      <span class="text-red-400 font-semibold text-dial">464 米 · 7 分钟</span>
      <span class="text-[14px] text-white/70">前方车流量大</span>
    </div>

    <!-- cruise / trip bottom center -->
    <div class="absolute bottom-[36px] left-[480px] right-[480px] flex items-center justify-between text-[15px] text-white/55 text-dial">
      <span>trip 114.4 km</span>
      <span class="flex items-center gap-2">
        <iconify-icon icon="mdi:speedometer-slow" class="text-[20px] text-white/40"></iconify-icon>
        巡航 50 km/h
      </span>
    </div>

    <!-- green set-speed bubble on map -->
    <div class="absolute left-[58%] top-[48%] w-[72px] h-[72px] rounded-full border-[3px] border-[#7dd957] flex items-center justify-center text-[26px] font-semibold text-[#7dd957] shadow-[0_0_24px_rgba(125,217,87,.35)] bg-black/40 text-dial">
      78
    </div>
  </div>

  <!-- edge vignette so dials read clearly -->
  <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(ellipse_90%_70%_at_50%_50%,transparent_40%,rgba(0,0,0,.55)_100%)]"></div>
  <div class="absolute inset-y-0 left-0 w-[420px] bg-gradient-to-r from-[#060a12] via-[#060a12]/80 to-transparent pointer-events-none"></div>
  <div class="absolute inset-y-0 right-0 w-[420px] bg-gradient-to-l from-[#060a12] via-[#060a12]/80 to-transparent pointer-events-none"></div>

  <!-- ═══ LEFT: tachometer dial ═══ -->
  <div class="absolute left-[48px] top-1/2 -translate-y-1/2 w-[580px] h-[580px]">
    <div class="absolute inset-[18px] rounded-full dial-face"></div>
    <svg class="absolute inset-0 w-full h-full dial-ring-glow" viewBox="0 0 580 580">
      <defs>
        <linearGradient id="chromeL" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(255,255,255,.35)"/>
          <stop offset="50%" stop-color="rgba(255,255,255,.08)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,.25)"/>
        </linearGradient>
      </defs>
      <circle cx="290" cy="290" r="268" fill="none" stroke="url(#chromeL)" stroke-width="2"/>
      <!-- redline zone -->
      <path d="M 290 290 L 290 42 A 248 248 0 0 1 430 120" fill="none" stroke="rgba(220,38,38,.35)" stroke-width="28" stroke-linecap="butt"/>
      <!-- ticks & numbers 0-8 -->
      <g fill="white" font-size="22" font-weight="500" text-anchor="middle" class="text-dial">
        <text x="290" y="58">0</text>
        <text x="378" y="88">1</text>
        <text x="448" y="158">2</text>
        <text x="478" y="248">3</text>
        <text x="478" y="348">4</text>
        <text x="448" y="438">5</text>
        <text x="378" y="508">6</text>
        <text x="290" y="538" fill="#f87171">7</text>
        <text x="202" y="508" fill="#ef4444">8</text>
      </g>
      <!-- active arc ~2.4k -->
      <circle cx="290" cy="290" r="248" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"
              stroke-dasharray="390 1165" transform="rotate(135 290 290)"/>
      <circle cx="290" cy="290" r="248" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="145 1410" transform="rotate(135 290 290)" style="filter:drop-shadow(0 0 8px rgba(255,255,255,.8))"/>
      <text x="290" y="318" text-anchor="middle" fill="rgba(255,255,255,.45)" font-size="16">×1000/min</text>
    </svg>

    <!-- inner ADAS / following -->
    <div class="absolute left-1/2 top-[46%] -translate-x-1/2 -translate-y-1/2 w-[300px] h-[220px]">
      <svg viewBox="0 0 300 220" class="w-full h-full">
        <path d="M40 200 Q150 40 260 200" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3"/>
        <path d="M90 200 Q150 90 210 200" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="2" stroke-dasharray="8 10"/>
        <path d="M130 200 L150 120 L170 200 Z" fill="rgba(255,255,255,.92)" stroke="rgba(200,200,200,.8)" stroke-width="1"/>
        <ellipse cx="150" cy="118" rx="22" ry="8" fill="rgba(0,0,0,.25)"/>
        <!-- lead vehicle -->
        <path d="M125 95 L150 72 L175 95 L170 108 L130 108 Z" fill="rgba(180,190,200,.85)"/>
      </svg>
      <div class="text-center -mt-2 text-[14px] text-white/45">跟车距离</div>
      <div class="text-center text-[32px] font-light text-dial">32 m</div>
    </div>

    <!-- bottom arc: water temp + compass -->
    <svg class="absolute bottom-[72px] left-1/2 -translate-x-1/2 w-[320px] h-[80px]" viewBox="0 0 320 80">
      <path d="M 24 70 A 136 136 0 0 1 296 70" class="arc-muted"/>
      <path d="M 24 70 A 136 136 0 0 1 200 70" class="arc-fill-blue"/>
      <text x="160" y="58" text-anchor="middle" fill="rgba(255,255,255,.5)" font-size="14">N</text>
    </svg>
    <div class="absolute bottom-[48px] left-1/2 -translate-x-1/2 flex items-center gap-2 text-[15px] text-white/60">
      <iconify-icon icon="mdi:coolant-temperature" class="text-[22px] text-[#4da3ff]"></iconify-icon>
      <span class="text-dial">88°C</span>
      <span class="text-white/35">· 水温</span>
    </div>
    <div class="absolute top-[52px] left-1/2 -translate-x-1/2 text-[36px] font-light text-dial opacity-90">2.4</div>
  </div>

  <!-- ═══ RIGHT: speedometer dial ═══ -->
  <div class="absolute right-[48px] top-1/2 -translate-y-1/2 w-[580px] h-[580px]">
    <div class="absolute inset-[18px] rounded-full dial-face"></div>
    <svg class="absolute inset-0 w-full h-full dial-ring-glow" viewBox="0 0 580 580">
      <circle cx="290" cy="290" r="268" fill="none" stroke="url(#chromeL)" stroke-width="2"/>
      <g fill="white" font-size="20" font-weight="500" text-anchor="middle" class="text-dial">
        <text x="290" y="58">0</text>
        <text x="370" y="75">40</text>
        <text x="435" y="115">80</text>
        <text x="475" y="175">120</text>
        <text x="492" y="248">160</text>
        <text x="492" y="338">200</text>
        <text x="460" y="405">240</text>
        <text x="290" y="538" font-size="18">km/h</text>
      </g>
      <circle cx="290" cy="290" r="248" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"
              stroke-dasharray="390 1165" transform="rotate(-45 290 290)"/>
      <circle cx="290" cy="290" r="248" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"
              stroke-dasharray="95 1460" transform="rotate(-45 290 290)" style="filter:drop-shadow(0 0 10px rgba(255,255,255,.85))"/>
    </svg>

    <!-- center: turn-by-turn -->
    <div class="absolute left-1/2 top-[42%] -translate-x-1/2 -translate-y-1/2 w-[280px] text-center">
      <div class="text-[15px] text-white/50 mb-2 truncate px-2">随后进入 · 东四环中路</div>
      <div class="flex items-center justify-center gap-3">
        <span class="text-[64px] font-light leading-none text-dial">7</span>
        <iconify-icon icon="mdi:arrow-top-right" class="text-[72px] text-white drop-shadow-[0_0_12px_rgba(255,255,255,.4)]"></iconify-icon>
      </div>
      <div class="mt-1 text-[42px] font-light text-dial leading-none">450</div>
      <div class="text-[18px] text-white/45">米</div>
    </div>

    <!-- bottom arc: fuel -->
    <svg class="absolute bottom-[72px] left-1/2 -translate-x-1/2 w-[320px] h-[80px]" viewBox="0 0 320 80">
      <path d="M 24 70 A 136 136 0 0 1 296 70" class="arc-muted"/>
      <path d="M 24 70 A 136 136 0 0 1 230 70" class="arc-fill-fuel"/>
    </svg>
    <div class="absolute bottom-[44px] left-1/2 -translate-x-1/2 flex items-center gap-3 text-[15px] text-white/55">
      <iconify-icon icon="mdi:gas-station" class="text-[20px]"></iconify-icon>
      <span class="text-dial">1/2</span>
    </div>
    <div class="absolute bottom-[108px] left-1/2 -translate-x-1/2 text-center">
      <span class="text-[48px] font-light text-dial">72</span>
      <span class="text-[16px] text-white/45 ml-1">km/h</span>
    </div>
  </div>

  <!-- subtle CarPlay fusion badge -->
  <div class="absolute bottom-[14px] right-[440px] flex items-center gap-2 text-[12px] text-white/25">
    <iconify-icon icon="simple-icons:apple"></iconify-icon>
    融合仪表概念 · 1920×720
  </div>
</div>
</body>
</html>
