<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>OEM 数字仪表 · 对照复现 1920×720</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Microsoft YaHei UI","PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#000}
    .screen{width:1920px;height:720px;position:relative;overflow:hidden;background:#030508;color:#fff}
    .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
    .glow-white{text-shadow:0 0 12px rgba(255,255,255,.55),0 0 24px rgba(255,255,255,.2)}
    .glow-soft{filter:drop-shadow(0 0 6px rgba(255,255,255,.45))}
    .dial-bg{
      background:radial-gradient(circle at 50% 42%,#1a2230 0%,#0c1018 45%,#050608 100%);
      box-shadow:inset 0 0 80px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.18),0 0 0 2px rgba(0,0,0,.9);
    }
    .horizon{
      background:
        radial-gradient(ellipse 55% 28% at 50% 42%,rgba(255,140,90,.22) 0%,rgba(160,90,200,.12) 35%,transparent 70%),
        radial-gradient(ellipse 90% 50% at 50% 55%,rgba(40,80,160,.08),transparent 60%),
        linear-gradient(180deg,#020306 0%,#080c14 100%);
    }
  </style>
</head>
<body>
<div class="screen">

  <!-- background horizon + center glow -->
  <div class="absolute inset-0 horizon" style="position:absolute;inset:0"></div>

  <!-- perspective road grid (center) -->
  <svg style="position:absolute;left:420px;top:120px;width:1080px;height:560px" viewBox="0 0 1080 560" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="roadFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(60,120,255,0)" />
        <stop offset="35%" stop-color="rgba(60,120,255,.12)" />
        <stop offset="100%" stop-color="rgba(20,40,80,.35)" />
      </linearGradient>
    </defs>
    <polygon points="540,80 980,520 100,520" fill="url(#roadFade)" opacity=".9"/>
    <!-- lane grid -->
    <g stroke="rgba(90,150,255,.35)" stroke-width="1.2" fill="none">
      <line x1="540" y1="100" x2="540" y2="520"/>
      <line x1="540" y1="140" x2="380" y2="520"/><line x1="540" y1="140" x2="700" y2="520"/>
      <line x1="540" y1="180" x2="300" y2="520"/><line x1="540" y1="180" x2="780" y2="520"/>
      <line x1="540" y1="220" x2="240" y2="520"/><line x1="540" y1="220" x2="840" y2="520"/>
      <line x1="540" y1="260" x2="200" y2="520"/><line x1="540" y1="260" x2="880" y2="520"/>
      <line x1="540" y1="300" x2="170" y2="520"/><line x1="540" y1="300" x2="910" y2="520"/>
      <line x1="540" y1="340" x2="150" y2="520"/><line x1="540" y1="340" x2="930" y2="520"/>
      <line x1="540" y1="380" x2="130" y2="520"/><line x1="540" y1="380" x2="950" y2="520"/>
      <line x1="120" y1="400" x2="960" y2="400"/><line x1="140" y1="440" x2="940" y2="440"/>
      <line x1="160" y1="480" x2="920" y2="480"/>
    </g>
    <!-- red center marker -->
    <line x1="540" y1="480" x2="540" y2="520" stroke="#e53935" stroke-width="3"/>
  </svg>

  <!-- ADAS vehicles -->
  <svg style="position:absolute;left:50%;top:430px;width:520px;height:220px;margin-left:-260px" viewBox="0 0 520 220">
    <!-- ghost cars ahead -->
    <g opacity=".45">
      <path d="M200 40 L260 40 L270 70 L190 70 Z" fill="rgba(200,210,220,.6)" stroke="rgba(255,255,255,.3)"/>
      <path d="M230 75 L250 95 L210 95 Z" fill="rgba(180,190,200,.5)"/>
    </g>
    <g opacity=".35" transform="translate(0,55)">
      <path d="M200 40 L260 40 L270 70 L190 70 Z" fill="rgba(200,210,220,.5)"/>
      <path d="M230 75 L250 95 L210 95 Z" fill="rgba(180,190,200,.4)"/>
    </g>
    <!-- green ACC bars -->
    <rect x="228" y="72" width="64" height="5" rx="2" fill="#3ddc68" opacity=".95"/>
    <rect x="228" y="82" width="64" height="5" rx="2" fill="#3ddc68" opacity=".85"/>
    <rect x="228" y="92" width="64" height="5" rx="2" fill="#3ddc68" opacity=".75"/>
    <!-- ego white sedan -->
    <path d="M165 115 L355 115 L375 155 L355 195 L165 195 L145 155 Z" fill="#f5f6f8" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
    <path d="M175 118 L345 118 L360 148 L160 148 Z" fill="rgba(200,210,225,.9)"/>
    <rect x="200" y="125" width="55" height="18" rx="2" fill="rgba(80,100,130,.35)"/>
    <rect x="265" y="125" width="55" height="18" rx="2" fill="rgba(80,100,130,.35)"/>
    <ellipse cx="175" cy="192" rx="14" ry="8" fill="#222"/>
    <ellipse cx="345" cy="192" rx="14" ry="8" fill="#222"/>
  </svg>

  <!-- TOP STATUS BAR -->
  <div style="position:absolute;top:28px;left:0;right:0;height:36px;display:flex;align-items:center;justify-content:center;gap:0;font-size:17px;color:rgba(255,255,255,.92)">
    <div style="position:absolute;left:48px;display:flex;align-items:center;gap:14px" class="num glow-soft">
      <span style="font-size:20px;font-weight:500">18:07</span>
      <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#57e389" d="M12 4c-3 0-5.5 2-6.5 4.8C7.8 8.3 9.8 8 12 8s4.2.3 6.5.8C17.5 6 15 4 12 4zm0 2c1.2 0 2.3.4 3.2 1.1-1.8-.3-3.7-.3-5.5 0 .9-.7 2-1.1 3.3-1.1zM4 14l2-6h12l2 6H4zm1 2h14v2H5v-2z"/></svg>
      <svg width="28" height="20" viewBox="0 0 28 20"><path d="M2 14h6l2-8 2 8h14" fill="none" stroke="#57e389" stroke-width="1.6" stroke-linejoin="round"/><line x1="2" y1="14" x2="26" y2="14" stroke="#57e389" stroke-width="1.4"/></svg>
    </div>
    <div style="display:flex;align-items:center;gap:28px;font-size:18px">
      <span style="color:rgba(255,255,255,.88)">舒适</span>
      <svg width="28" height="28" viewBox="0 0 24 24"><path fill="#ff5252" d="M12 2C8 2 5 5 5 9v7h2v-5c0-2.2 1.8-4 4-4h2c2.2 0 4 1.8 4 4v5h2V9c0-4-3-7-7-7zm-1 14h2v4h-2v-4z"/></svg>
      <span style="color:#ff5252;font-weight:600;font-size:20px">(P)</span>
    </div>
    <div style="position:absolute;right:48px;font-size:20px" class="num">17°C</div>
  </div>

  <!-- CENTER SPEED + GEAR -->
  <div style="position:absolute;top:72px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:16px">
    <span class="num glow-white" style="font-size:112px;font-weight:300;line-height:.85;letter-spacing:-2px">0</span>
    <div style="display:flex;flex-direction:column;align-items:flex-start;padding-bottom:8px">
      <div style="width:52px;height:52px;border:2px solid rgba(255,255,255,.75);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:500;margin-bottom:6px" class="num">P</div>
      <span style="font-size:22px;color:rgba(255,255,255,.75)">km/h</span>
    </div>
  </div>

  <!-- LEFT DIAL -->
  <div style="position:absolute;left:36px;top:50%;transform:translateY(-46%);width:560px;height:560px">
    <div class="dial-bg" style="position:absolute;inset:8px;border-radius:50%"></div>
    <svg viewBox="0 0 560 560" style="position:absolute;inset:0;width:100%;height:100%" class="glow-soft">
      <!-- redline sector -->
      <path d="M280 280 L280 48 A232 232 0 0 0 118 418" fill="none" stroke="rgba(220,60,60,.28)" stroke-width="22"/>
      <!-- ring -->
      <circle cx="280" cy="280" r="248" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
      <!-- ticks -->
      <g stroke="rgba(255,255,255,.85)" stroke-width="2">
        <g transform="rotate(90 280 280)">
          <line x1="280" y1="48" x2="280" y2="58"/><line x1="280" y1="48" x2="280" y2="58" transform="rotate(36 280 280)"/>
        </g>
      </g>
      <!-- numbers 0–8：0 在下方，逆时针 -->
      <g fill="white" font-size="26" font-weight="400" text-anchor="middle" class="num">
        <text x="280" y="502">0</text>
        <text x="218" y="478">1</text>
        <text x="162" y="438">2</text>
        <text x="118" y="378">3</text>
        <text x="88" y="308">4</text>
        <text x="78" y="232">5</text>
        <text x="92" y="158">6</text>
        <text x="132" y="98" fill="#ffb4b4">7</text>
        <text x="198" y="62" fill="#ff8888">8</text>
      </g>
      <!-- needle at 0 -->
      <line x1="280" y1="280" x2="280" y2="502" stroke="white" stroke-width="2.5" stroke-linecap="round" style="filter:drop-shadow(0 0 8px #fff)"/>
      <circle cx="280" cy="280" r="6" fill="#ccc"/>
      <text x="380" y="520" fill="rgba(255,255,255,.55)" font-size="16" text-anchor="start">×1000r/min</text>
    </svg>

    <!-- inner: tire pressure -->
    <div style="position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:260px;text-align:center">
      <div style="display:flex;align-items:center;justify-content:center;gap:20px;font-size:17px;color:rgba(255,255,255,.75);margin-bottom:8px">
        <span style="opacity:.5">‹</span>
        <span>胎压监测</span>
        <span style="opacity:.5">›</span>
      </div>
      <svg viewBox="0 0 200 120" style="width:200px;height:120px;margin:0 auto;display:block">
        <rect x="55" y="25" width="90" height="70" rx="12" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
        <path d="M70 95 L130 95 L125 75 L75 75 Z" fill="rgba(255,255,255,.15)"/>
        <text x="30" y="55" fill="white" font-size="18" class="num">2.3</text>
        <text x="165" y="55" fill="white" font-size="18" class="num">2.4</text>
        <text x="30" y="105" fill="white" font-size="18" class="num">2.3</text>
        <text x="165" y="105" fill="white" font-size="18" class="num">2.2</text>
      </svg>
    </div>

    <!-- water temp arc -->
    <svg style="position:absolute;bottom:58px;left:50%;margin-left:-150px;width:300px;height:70px" viewBox="0 0 300 70">
      <path d="M20 55 A130 130 0 0 1 280 55" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="4"/>
      <path d="M20 55 A130 130 0 0 1 165 55" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #fff)"/>
      <text x="35" y="52" fill="rgba(255,255,255,.5)" font-size="13" class="num">50</text>
      <text x="145" y="38" fill="rgba(255,255,255,.65)" font-size="13" class="num">90</text>
      <text x="255" y="52" fill="rgba(255,255,255,.5)" font-size="13" class="num">130</text>
      <g transform="translate(138,48)">
        <path d="M0 0 L0 -12 M-4 -8 L4 -8" stroke="white" stroke-width="1.5" fill="none"/>
        <circle cx="0" cy="2" r="5" fill="none" stroke="white" stroke-width="1.2"/>
      </g>
    </svg>
  </div>

  <!-- RIGHT DIAL -->
  <div style="position:absolute;right:36px;top:50%;transform:translateY(-46%);width:560px;height:560px">
    <div class="dial-bg" style="position:absolute;inset:8px;border-radius:50%"></div>
    <svg viewBox="0 0 560 560" style="position:absolute;inset:0;width:100%;height:100%" class="glow-soft">
      <circle cx="280" cy="280" r="248" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
      <g fill="white" font-size="21" font-weight="400" text-anchor="middle" class="num">
        <text x="280" y="502">0</text>
        <text x="218" y="485">20</text>
        <text x="162" y="452">40</text>
        <text x="118" y="402">60</text>
        <text x="88" y="342">80</text>
        <text x="72" y="278">100</text>
        <text x="88" y="212">120</text>
        <text x="118" y="152">140</text>
        <text x="162" y="102">160</text>
        <text x="218" y="68">180</text>
        <text x="280" y="58">200</text>
        <text x="348" y="68">230</text>
        <text x="402" y="102">260</text>
      </g>
      <line x1="280" y1="280" x2="280" y2="502" stroke="white" stroke-width="2.5" stroke-linecap="round" style="filter:drop-shadow(0 0 8px #fff)"/>
      <circle cx="280" cy="280" r="6" fill="#ccc"/>
      <text x="175" y="520" fill="rgba(255,255,255,.55)" font-size="16" text-anchor="start">km/h</text>
    </svg>

    <!-- inner: music -->
    <div style="position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:280px;text-align:center">
      <svg viewBox="0 0 120 100" style="width:100px;height:84px;margin:0 auto 10px;display:block">
        <defs>
          <linearGradient id="noteG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#5eead4"/><stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
        </defs>
        <ellipse cx="60" cy="50" rx="48" ry="40" fill="rgba(59,130,246,.12)"/>
        <path d="M48 28 L48 62 Q48 72 38 72 Q28 72 28 62 Q28 52 38 52 L48 52 L48 28 L68 24 L68 56 Q68 66 58 66 Q48 66 48 56" fill="url(#noteG)" style="filter:drop-shadow(0 0 12px rgba(94,234,212,.6))"/>
        <path d="M20 78 Q35 70 50 78 T80 78" fill="none" stroke="rgba(94,234,212,.5)" stroke-width="2"/>
        <path d="M25 88 Q40 82 55 88 T85 88" fill="none" stroke="rgba(59,130,246,.4)" stroke-width="1.5"/>
      </svg>
      <div style="font-size:22px;color:rgba(255,255,255,.92);letter-spacing:.5px;margin-bottom:4px">有缘天涯亦咫尺</div>
      <div style="font-size:16px;color:rgba(255,255,255,.45)">邰正宵</div>
    </div>

    <!-- fuel arc -->
    <svg style="position:absolute;bottom:58px;left:50%;margin-left:-150px;width:300px;height:70px" viewBox="0 0 300 70">
      <path d="M20 55 A130 130 0 0 1 280 55" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="4"/>
      <path d="M20 55 A130 130 0 0 1 210 55" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #fff)"/>
      <text x="35" y="52" fill="rgba(255,255,255,.5)" font-size="13" class="num">0</text>
      <text x="145" y="38" fill="rgba(255,255,255,.65)" font-size="13" class="num">1/2</text>
      <text x="255" y="52" fill="rgba(255,255,255,.5)" font-size="13" class="num">1</text>
      <g transform="translate(138,50)">
        <rect x="-6" y="-10" width="12" height="14" rx="2" fill="none" stroke="white" stroke-width="1.3"/>
        <path d="M6 -6 L10 -6 L10 2 L6 2" fill="none" stroke="white" stroke-width="1.2"/>
      </g>
    </svg>
  </div>

</div>
</body>
</html>
