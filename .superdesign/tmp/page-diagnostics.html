<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CarPlay HS5 · 诊断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>body{margin:0;font-family:-apple-system,"SF Pro Display","PingFang SC",sans-serif}.tog{width:68px;height:38px;border-radius:999px;background:#34445b;position:relative;flex-shrink:0}.tog.on{background:#087bff}.tog.on span{transform:translateX(28px)}.tog span{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:999px;background:#fff}</style>
</head>
<body>
<div id="screen-root" class="w-[1920px] h-[720px] flex flex-col bg-[#071426] text-[#f2f7ff] overflow-hidden">
  <header class="shrink-0 h-[96px] flex items-center justify-between px-10 border-b border-[#263c5a]/90">
    <div class="flex items-center gap-12 h-full">
      <div class="flex items-center gap-3"><div class="w-1 h-9 bg-[#c8102e] rounded-full"></div><span class="text-[26px] font-semibold">CarPlay <span class="text-[#8faed5] font-normal">HS5</span></span></div>
      <nav class="flex items-center gap-2 h-full py-2">
        <a id="nav-connect" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] text-[#8faed5] text-[22px] font-semibold">连接</a>
        <a id="nav-display" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] text-[#8faed5] text-[22px] font-semibold">显示</a>
        <a id="nav-settings" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] text-[#8faed5] text-[22px] font-semibold">设置</a>
        <a id="nav-diagnostics" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] bg-[#087bff] text-[22px] font-semibold">诊断</a>
        <a id="nav-about" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] text-[#8faed5] text-[22px] font-semibold">关于</a>
      </nav>
    </div>
    <span id="status-clock" class="text-[20px] text-[#8faed5]">14:20</span>
  </header>
  <main class="flex-1 min-h-0 flex gap-6 px-10 py-7 overflow-hidden">
    <section class="w-[42%] flex flex-col gap-4 min-h-0">
      <div class="rounded-[28px] border border-[#263c5a]/80 bg-[#0d1c30]/95 p-5 flex-1">
        <div class="flex items-center justify-between mb-4"><div><div class="text-[18px] font-semibold">记录会话日志</div><div class="text-[14px] text-[#8faed5]">连接过程写入本地</div></div><div class="tog on"><span></span></div></div>
        <button type="button" id="btn-clear-logs" class="w-full h-[52px] rounded-xl bg-white/5 border border-[#263c5a] text-[17px] font-semibold mb-4">清除会话日志</button>
        <div class="flex items-center justify-between py-3 border-t border-[#263c5a]/40"><div><div class="text-[17px] font-semibold">模拟仪表 (实验性)</div><div class="text-[13px] text-[#8faed5]">无副屏时调试 cluster</div></div><div class="tog"><span></span></div></div>
        <button type="button" id="btn-save-report" class="w-full h-[56px] mt-4 rounded-xl bg-[#087bff] text-[18px] font-bold">保存诊断报告</button>
        <button type="button" id="row-qr-download" class="w-full flex items-center justify-between mt-3 h-[64px] px-1 text-left"><div><div class="text-[17px] font-semibold">扫码下载报告</div><div class="text-[13px] text-[#8faed5]">手机浏览器下载</div></div><iconify-icon icon="lucide:chevron-right" class="text-[#8faed5]"></iconify-icon></button>
        <button type="button" id="row-storage" class="w-full flex items-center justify-between h-[64px] px-1 text-left border-t border-[#263c5a]/40 mt-2 pt-2"><div class="min-w-0"><div class="text-[17px] font-semibold">报告存储位置</div><div class="text-[13px] text-[#8faed5] truncate">/storage/.../DiPlay/reports</div></div><iconify-icon icon="lucide:chevron-right" class="text-[#8faed5] shrink-0"></iconify-icon></button>
      </div>
    </section>
    <section class="w-[58%] rounded-[28px] border border-[#263c5a]/80 bg-[#0d1c30]/95 flex flex-col min-h-0 overflow-hidden">
      <div class="px-6 py-4 border-b border-[#263c5a]/40 flex items-center justify-between">
        <h2 class="text-[22px] font-bold">最近报告</h2>
        <span class="text-[14px] text-[#8faed5]">3 个文件</span>
      </div>
      <div class="flex-1 overflow-y-auto">
        <div class="flex items-center px-6 py-4 border-b border-[#263c5a]/30">
          <iconify-icon icon="lucide:file-text" class="text-3xl text-[#087bff] mr-4"></iconify-icon>
          <div class="flex-1 min-w-0"><div class="text-[17px] font-semibold truncate">CarPlay-20261019-150012.txt</div><div class="text-[14px] text-[#8faed5]">今天 15:00 · 128 KB</div></div>
          <div class="flex gap-2"><button type="button" id="rep1-view" class="w-10 h-10 rounded-lg border border-[#263c5a] flex items-center justify-center"><iconify-icon icon="lucide:eye"></iconify-icon></button><button type="button" id="rep1-share" class="w-10 h-10 rounded-lg border border-[#263c5a] flex items-center justify-center"><iconify-icon icon="lucide:share-2"></iconify-icon></button><button type="button" id="rep1-delete" class="w-10 h-10 rounded-lg border border-[#263c5a] flex items-center justify-center"><iconify-icon icon="lucide:trash-2" class="text-red-400"></iconify-icon></button></div>
        </div>
        <div class="flex items-center px-6 py-4 border-b border-[#263c5a]/30">
          <iconify-icon icon="lucide:file-text" class="text-3xl text-[#087bff] mr-4"></iconify-icon>
          <div class="flex-1 min-w-0"><div class="text-[17px] font-semibold truncate">CarPlay-20261018-175557.txt</div><div class="text-[14px] text-[#8faed5]">昨天 17:55 · 96 KB</div></div>
          <div class="flex gap-2"><button type="button" id="rep2-view" class="w-10 h-10 rounded-lg border border-[#263c5a]"></button><button type="button" id="rep2-share" class="w-10 h-10 rounded-lg border border-[#263c5a]"></button><button type="button" id="rep2-delete" class="w-10 h-10 rounded-lg border border-[#263c5a]"></button></div>
        </div>
        <div class="flex items-center px-6 py-4">
          <iconify-icon icon="lucide:file-text" class="text-3xl text-[#087bff] mr-4"></iconify-icon>
          <div class="flex-1 min-w-0"><div class="text-[17px] font-semibold truncate">CarPlay-20261018-171634.txt</div><div class="text-[14px] text-[#8faed5]">昨天 17:16 · 94 KB</div></div>
          <div class="flex gap-2"><button type="button" id="rep3-view" class="w-10 h-10 rounded-lg border border-[#263c5a]"></button><button type="button" id="rep3-share" class="w-10 h-10 rounded-lg border border-[#263c5a]"></button><button type="button" id="rep3-delete" class="w-10 h-10 rounded-lg border border-[#263c5a]"></button></div>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
