<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CarPlay HS5 · 导航车标位置 · 编辑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    body{margin:0;font-family:-apple-system,"SF Pro Display","PingFang SC",sans-serif}
    .map-bg{
      background:#0a1628;
      background-image:linear-gradient(rgba(38,60,90,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(38,60,90,.28) 1px,transparent 1px);
      background-size:40px 40px;
    }
    .road{stroke:#2a4568;stroke-width:16;stroke-linecap:round;fill:none}
    .road-main{stroke:#3d5f8a;stroke-width:26}
    .cross{stroke:rgba(8,123,255,.55);stroke-width:2;stroke-dasharray:7 5}
    #preview-column{box-shadow:0 0 0 2px rgba(8,123,255,.55),0 0 48px rgba(8,123,255,.18)}
    #car-marker{cursor:grab;touch-action:none}
    #car-marker.dragging{cursor:grabbing;transform:translate(-50%,-50%) scale(1.06)}
  </style>
</head>
<body>
<div id="screen-root" class="w-[1920px] h-[720px] flex flex-col bg-[#071426] text-[#f2f7ff] overflow-hidden">
  <header class="shrink-0 h-[96px] flex items-center justify-between px-10 border-b border-[#263c5a]/90">
    <div class="flex items-center gap-12 h-full">
      <div class="flex items-center gap-3"><div class="w-1 h-9 bg-[#c8102e] rounded-full"></div><span class="text-[26px] font-semibold">CarPlay <span class="text-[#8faed5] font-normal">HS5</span></span></div>
      <nav class="flex items-center gap-2 h-full py-2">
        <a id="nav-connect" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] text-[#8faed5] text-[22px] font-semibold">连接</a>
        <a id="nav-display" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] bg-[#087bff] text-[22px] font-semibold">显示</a>
        <a id="nav-settings" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] text-[#8faed5] text-[22px] font-semibold">设置</a>
        <a id="nav-diagnostics" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] text-[#8faed5] text-[22px] font-semibold">诊断</a>
        <a id="nav-about" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] text-[#8faed5] text-[22px] font-semibold">关于</a>
      </nav>
    </div>
    <span id="status-clock" class="text-[20px] text-[#8faed5]">14:20</span>
  </header>
  <main class="flex-1 min-h-0 px-10 py-7 flex gap-10">
    <section id="preview-column" class="w-[58%] min-w-0 h-full rounded-[32px] border border-[#087bff]/50 overflow-hidden map-bg relative flex items-center justify-center">
      <div id="preview-frame" class="relative w-full max-h-full aspect-[16/9]">
        <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice">
          <path class="road road-main" d="M100 400 C 260 360, 400 190, 600 150 S 880 110, 920 70"/>
          <path class="road" d="M30 270 H 930"/>
          <path class="road" d="M480 30 V 510"/>
          <line class="cross" x1="480" y1="190" x2="480" y2="350"/>
          <line class="cross" x1="400" y1="270" x2="560" y2="270"/>
        </svg>
        <div id="car-marker" class="absolute w-[52px] h-[52px] -translate-x-1/2 -translate-y-1/2 ring-4 ring-[#087bff]/45 rounded-full" style="left:58%;top:42%">
          <div class="w-full h-full rounded-full bg-[#ffb347] border-2 border-white flex items-center justify-center shadow-lg">
            <iconify-icon icon="mdi:navigation" class="text-[28px] text-[#071426] rotate-45"></iconify-icon>
          </div>
        </div>
      </div>
    </section>
    <section id="settings-column" class="w-[42%] min-w-0 h-full flex flex-col">
      <div class="flex items-center gap-3 mb-6">
        <h1 id="page-title" class="text-[32px] font-bold tracking-tight">导航车标位置</h1>
        <span id="edit-badge" class="px-2.5 py-0.5 rounded-md bg-[#087bff]/25 text-[#87c4ff] text-[14px] font-semibold">编辑</span>
      </div>
      <div class="rounded-[28px] border border-[#263c5a]/80 bg-[#0d1c30]/95 overflow-hidden flex-1 flex flex-col">
        <div class="flex items-center justify-between px-6 h-[68px] border-b border-[#263c5a]/40">
          <span class="text-[18px] font-semibold">水平</span>
          <span id="stat-x" class="text-[17px] text-[#87c4ff] font-semibold tabular-nums">58%</span>
        </div>
        <div class="flex items-center justify-between px-6 h-[68px] border-b border-[#263c5a]/40">
          <span class="text-[18px] font-semibold">垂直</span>
          <span id="stat-y" class="text-[17px] text-[#87c4ff] font-semibold tabular-nums">42%</span>
        </div>
      </div>
      <div class="mt-4 flex gap-[14px] shrink-0">
        <button type="button" id="btn-cancel" class="flex-1 h-[68px] rounded-[12px] border border-[#263c5a]/80 bg-white/5 text-[#087bff] text-[18px] font-semibold">取消</button>
        <button type="button" id="btn-save" class="flex-1 h-[68px] rounded-[12px] bg-gradient-to-b from-[#1a8cff] to-[#087bff] text-[18px] font-semibold">保存</button>
      </div>
    </section>
  </main>
</div>
<script>
(function(){
  const frame=document.getElementById('preview-frame');
  const marker=document.getElementById('car-marker');
  const statX=document.getElementById('stat-x');
  const statY=document.getElementById('stat-y');
  let px=58, py=42, drag=false;
  function snap(v){return Math.round(v/2)*2;}
  function apply(){
    marker.style.left=px+'%'; marker.style.top=py+'%';
    statX.textContent=px+'%'; statY.textContent=py+'%';
  }
  function fromEvent(e){
    const r=frame.getBoundingClientRect();
    const x=((e.clientX??e.touches[0].clientX)-r.left)/r.width*100;
    const y=((e.clientY??e.touches[0].clientY)-r.top)/r.height*100;
    px=snap(Math.min(98,Math.max(2,x)));
    py=snap(Math.min(98,Math.max(2,y)));
    apply();
  }
  marker.addEventListener('pointerdown',e=>{drag=true;marker.classList.add('dragging');marker.setPointerCapture(e.pointerId);fromEvent(e);});
  marker.addEventListener('pointermove',e=>{if(drag)fromEvent(e);});
  marker.addEventListener('pointerup',()=>{drag=false;marker.classList.remove('dragging');});
  marker.addEventListener('pointercancel',()=>{drag=false;marker.classList.remove('dragging');});
})();
</script>
</body>
</html>
