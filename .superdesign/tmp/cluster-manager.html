<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=720, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <title>CarPlay HS5 · 仪表管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="prefetch" href="https://p.superdesign.dev/draft/42cc31cb-1166-48d7-8b80-0029abd33b19" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/ac1b0716-c638-4f39-bd6d-0de113c2d5e4" as="document">
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    html { background-color: #071426; }
    @view-transition { navigation: auto; }
    ::view-transition { background-color: #071426; }
    ::view-transition-old(main-nav), ::view-transition-new(main-nav), ::view-transition-old(brand-lockup), ::view-transition-new(brand-lockup) { animation: none; mix-blend-mode: normal; }
    ::view-transition-old(main-content) { animation: 0.25s ease-out both fade-out; }
    ::view-transition-new(main-content) { animation: 0.25s ease-in 0.1s both fade-in; }
    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div class="w-[1920px] h-[720px] flex flex-col bg-[#071426] text-[#F2F7FF] overflow-hidden">
    <!-- Persistent Header from Source -->
    <header style="view-transition-name: main-nav;" class="shrink-0 h-[96px] flex items-center justify-between px-10 border-b border-[#263c5a]/90 bg-[#071426] z-40">
      <div class="flex items-center gap-12 h-full">
        <div style="view-transition-name: brand-lockup;" class="flex items-center gap-3">
          <div class="w-1 h-9 bg-[#c8102e] rounded-full"></div>
          <span class="text-[26px] font-semibold tracking-tight">CarPlay <span class="text-[#8faed5] font-normal">HS5</span></span>
        </div>
        <nav class="flex items-center gap-2 h-full py-2">
          <a id="nav-connect" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] text-[#8faed5] text-[22px] font-semibold hover:bg-white/5 transition-colors">连接</a>
          <a id="nav-display" href="https://p.superdesign.dev/draft/42cc31cb-1166-48d7-8b80-0029abd33b19" class="px-9 h-[72px] flex items-center rounded-[18px] bg-[#087bff] text-[22px] font-semibold">显示</a>
          <a id="nav-settings" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] text-[#8faed5] text-[22px] font-semibold hover:bg-white/5 transition-colors">设置</a>
          <a id="nav-diagnostics" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] text-[#8faed5] text-[22px] font-semibold hover:bg-white/5 transition-colors">诊断</a>
          <a id="nav-about" href="#" class="px-9 h-[72px] flex items-center rounded-[18px] text-[#8faed5] text-[22px] font-semibold hover:bg-white/5 transition-colors">关于</a>
        </nav>
      </div>
      <span id="status-clock" class="text-[20px] text-[#8faed5]">14:20</span>
    </header>

    <!-- Dynamic Content Area -->
    <main style="view-transition-name: main-content;" class="flex-1 min-h-0 flex flex-col">
      <div class="px-10 py-7 flex items-center justify-between">
        <div class="flex items-center gap-6">
          <a id="back-link" href="https://p.superdesign.dev/draft/42cc31cb-1166-48d7-8b80-0029abd33b19" class="w-16 h-16 flex items-center justify-center rounded-2xl bg-[#101F33] border border-[#263c5a] text-[#F2F7FF] active:scale-95 transition-transform">
            <iconify-icon icon="lucide:chevron-left" class="text-[32px]"></iconify-icon>
          </a>
          <div>
            <h1 class="text-[32px] font-bold tracking-tight">仪表管理</h1>
            <p class="text-[18px] text-[#8faed5]">选择仪表样式</p>
          </div>
        </div>
      </div>

      <div class="flex-1 px-10 pb-10 overflow-y-auto scrollbar-hide flex flex-col gap-6">
        <!-- Style Card 1: 基础 (Active) -->
        <div class="shrink-0 w-full flex bg-[#101F33] rounded-[32px] border-2 border-[#087bff] overflow-hidden shadow-2xl relative">
          <div class="absolute top-6 left-6 z-10">
            <span class="px-4 py-1.5 rounded-full bg-[#087bff] text-white text-[14px] font-bold tracking-widest uppercase shadow-lg shadow-blue-900/40">静态预览</span>
          </div>
          <div class="w-[560px] h-[340px] bg-[#071426] flex items-center justify-center p-4">
            <!-- Static schematic of the existing basic cluster -->
            <svg viewBox="0 0 600 260" role="img" aria-label="基础仪表静态示意" class="w-full h-full">
              <defs><radialGradient id="dial"><stop stop-color="#34445b"/><stop offset="1" stop-color="#101F33"/></radialGradient></defs>
              <rect width="600" height="260" fill="#071426"/>
              <path d="M210 25H390V235H210Z" fill="#263c5a"/>
              <path d="M250 0L315 260M370 0L280 260M210 80L390 110M210 170L390 200" stroke="#8faed5" stroke-width="6" opacity=".3"/>
              <path d="M300 235V175L345 125V45" stroke="#087bff" stroke-width="9" fill="none"/>
              <path d="M300 211l-9 18h18z" fill="#F2F7FF"/>
              <circle cx="127" cy="130" r="110" fill="url(#dial)" stroke="#8faed5" stroke-width="3"/>
              <circle cx="473" cy="130" r="110" fill="url(#dial)" stroke="#8faed5" stroke-width="3"/>
              <circle cx="127" cy="130" r="72" fill="#101F33" stroke="#34445b" stroke-width="3"/>
              <circle cx="473" cy="130" r="72" fill="#101F33" stroke="#34445b" stroke-width="3"/>
              <g fill="#F2F7FF" font-size="17" text-anchor="middle"><text x="45" y="173">0</text><text x="34" y="115">1</text><text x="72" y="51">2</text><text x="127" y="36">3</text><text x="184" y="52">4</text><text x="217" y="111">5</text><text x="210" y="171">6</text><text x="391" y="173">0</text><text x="380" y="115">40</text><text x="418" y="51">80</text><text x="473" y="36">120</text><text x="530" y="52">160</text><text x="563" y="111">200</text><text x="556" y="171">260</text></g>
              <path d="M80 185L127 98L174 185M95 185L127 98L160 185M75 150H179M66 170H188" stroke="#34445b" fill="none"/>
              <rect x="115" y="142" width="24" height="35" rx="7" fill="#F2F7FF"/><rect x="118" y="147" width="18" height="10" rx="3" fill="#34445b"/>
              <path d="M127 130L50 158M473 130L405 180" stroke="#F2F7FF" stroke-width="3"/>
              <path d="M471 146V104L494 100V137M471 104L494 100" stroke="#8faed5" stroke-width="5" fill="none"/><ellipse cx="464" cy="147" rx="10" ry="6" fill="#8faed5"/><ellipse cx="487" cy="138" rx="10" ry="6" fill="#8faed5"/>
              <g fill="#8faed5" text-anchor="middle" font-size="14"><text x="127" y="217">×1000 r/min</text><text x="473" y="217">km/h</text></g>
            </svg>
          </div>
          <div class="flex-1 p-10 flex flex-col justify-between items-start">
            <div class="w-full">
              <div class="flex items-center justify-between">
                <h2 class="text-[36px] font-semibold mb-3">基础 <span class="text-[20px] font-normal text-[#8faed5] ml-4">双仪表与导航融合</span></h2>
              </div>
              <p class="text-[20px] text-[#8faed5] leading-relaxed max-w-[800px]">融合传统双圆形仪表与 CarPlay 实时导航画面。左侧显示发动机转速及辅助驾驶状态，右侧集成车速与多媒体信息。</p>
            </div>
            <div class="w-full flex justify-end">
              <button disabled class="px-12 h-[88px] rounded-[24px] bg-[#087bff]/20 text-[#087bff] text-[24px] font-bold flex items-center gap-3 opacity-80">
                <iconify-icon icon="lucide:check-circle"></iconify-icon>
                <span>已应用</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Style Card 2: 原始 -->
        <div class="shrink-0 w-full flex bg-[#101F33] rounded-[32px] border border-[#263c5a] overflow-hidden active:bg-[#162945] transition-colors">
          <div class="w-[560px] h-[340px] bg-[#071426] flex items-center justify-center p-4">
            <!-- Illustrative Thumbnail: Original Style -->
            <div class="w-full h-full rounded-2xl bg-slate-900 border border-[#263c5a] flex items-center justify-center relative overflow-hidden">
               <iconify-icon icon="lucide:navigation-2" class="absolute text-[120px] text-[#263c5a]/20 rotate-45"></iconify-icon>
               <div class="flex flex-col items-center gap-4">
                 <iconify-icon icon="lucide:map" class="text-6xl text-[#8faed5]"></iconify-icon>
                 <span class="text-[18px] text-[#8faed5] tracking-widest">CarPlay 原生地图示意</span>
               </div>
            </div>
          </div>
          <div class="flex-1 p-10 flex flex-col justify-between items-start">
            <div class="w-full">
              <h2 class="text-[36px] font-semibold mb-3">原始 <span class="text-[20px] font-normal text-[#8faed5] ml-4">CarPlay 原生地图飞屏</span></h2>
              <p class="text-[20px] text-[#8faed5] leading-relaxed max-w-[800px]">使用 CarPlay 原有的仪表地图画面。</p>
            </div>
            <div class="w-full flex justify-end">
              <button id="apply-original" class="px-12 h-[88px] rounded-[24px] bg-[#087bff] text-white text-[24px] font-bold active:scale-95 transition-transform">
                应用到仪表盘
              </button>
            </div>
          </div>
        </div>

        <!-- Scroll Affordance Spacer -->
        <div class="h-10 shrink-0"></div>
      </div>
    </main>

    <!-- Feedback Toast (Hidden by default) -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-10 py-5 bg-white text-black rounded-full font-semibold text-[22px] shadow-2xl transition-all opacity-0 translate-y-10 pointer-events-none z-50">
      预览已切换为原始样式
    </div>
  </div>

  <script>
    const applyBtn = document.getElementById('apply-original');
    const toast = document.getElementById('toast');
    
    if(applyBtn) {
      applyBtn.onclick = () => {
        const cards = document.querySelectorAll('main .shrink-0.w-full.flex');
        cards[0].classList.remove('border-2', 'border-[#087bff]');
        cards[0].classList.add('border', 'border-[#263c5a]');
        cards[1].classList.remove('border', 'border-[#263c5a]');
        cards[1].classList.add('border-2', 'border-[#087bff]');
        applyBtn.textContent = '已应用';
        applyBtn.disabled = true;
        const previous = cards[0].querySelector('button');
        previous.disabled = false;
        previous.textContent = '应用到仪表盘';
        previous.onclick = () => window.location.reload();
        toast.classList.remove('opacity-0', 'translate-y-10');
        toast.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-10');
          toast.classList.remove('opacity-100', 'translate-y-0');
        }, 2000);
      };
    }
  </script>
</body>
</html>
