<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920,height=720,initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
      :root {
        --hq-bg: #071426;
        --hq-panel: #0d1e34;
        --hq-red: #c8102e;
        --hq-text-muted: rgba(255, 255, 255, 0.5);
        --hq-border: rgba(255, 255, 255, 0.08);
      }
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: var(--hq-bg);
        font-family:
          -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue",
          sans-serif;
        color: white;
      }
      .panel {
        background-color: var(--hq-panel);
        border: 1px solid var(--hq-border);
        border-radius: 12px;
        overflow: hidden;
      }
      .map-grid {
        background-image: radial-gradient(
          circle at 2px 2px,
          rgba(255, 255, 255, 0.05) 1px,
          transparent 0
        );
        background-size: 40px 40px;
      }
      .map-road {
        fill: none;
        stroke: rgba(255, 255, 255, 0.15);
        stroke-width: 12;
        stroke-linecap: round;
      }
      .map-road-active {
        fill: none;
        stroke: #3b82f6;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <div
      class="w-[1920px] h-[720px] bg-[#071426] relative overflow-hidden select-none"
      data-sd-id="1"
    >
      <header
        class="absolute top-0 left-0 w-full h-[80px] px-8 flex items-center justify-between border-b border-white/5 z-50 bg-[#071426]"
        data-sd-id="2"
      >
        <div class="flex items-center gap-4" data-sd-id="3">
          <div class="flex items-center gap-2" data-sd-id="4">
            <span class="text-2xl font-semibold tracking-tight" data-sd-id="5"
              >CarPlay</span
            >
            <div class="h-4 w-[1px] bg-white/20" data-sd-id="6"></div>
            <span class="text-2xl font-semibold tracking-tight" data-sd-id="7"
              >HS5</span
            >
          </div>
          <div
            class="flex items-center gap-3 ml-8 text-white/40"
            data-sd-id="8"
          >
            自定义仪表
          </div>
        </div>
        <div
          class="text-3xl font-medium tracking-tight"
          id="clock"
          data-sd-id="9"
        >
          14:28
        </div>
        <div
          class="flex items-center gap-4 w-[240px] justify-end"
          data-sd-id="10"
        >
          <span class="text-white/40 text-sm" data-sd-id="11">连接状态:</span>
          <div
            class="flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10"
            data-sd-id="12"
          >
            <div
              class="w-2 h-2 rounded-full bg-[#C8102E]"
              data-sd-id="13"
            ></div>
            <span class="text-sm font-medium" data-sd-id="14">已连接</span>
          </div>
        </div>
      </header>
      <div
        class="absolute left-[32px] top-[120px] w-[1216px] h-[456px] panel bg-black flex items-center justify-center overflow-hidden"
        data-sd-id="15"
      >
        <div class="relative w-full h-full map-grid opacity-60" data-sd-id="16">
          <svg
            class="absolute inset-0 w-full h-full"
            viewBox="0 0 1216 456"
            data-sd-id="17"
          >
            <path
              d="M-20 300 Q 300 280 500 350 T 1250 320"
              class="map-road"
            ></path>
            <path
              d="M-20 150 Q 400 180 600 100 T 1250 150"
              class="map-road"
            ></path>
            <path d="M600 480 L 600 -20" class="map-road"></path>
            <path
              d="M600 480 Q 600 350 750 300 T 1100 200"
              class="map-road-active"
            ></path>
          </svg>
          <div
            class="absolute bottom-4 right-4 bg-black/40 backdrop-blur-md px-4 py-2 rounded text-sm text-white/60 flex items-center gap-2 border border-white/10"
            data-sd-id="18"
          >
            <iconify-icon icon="lucide:map-pin"></iconify-icon> 正在等待 CarPlay
            地图流...
          </div>
        </div>
      </div>
      <div
        class="absolute left-[32px] top-[596px] w-[1216px] h-[92px] flex items-center justify-between px-8 bg-white/5 border border-white/5 rounded-xl"
        data-sd-id="19"
      >
        <div class="flex flex-col" data-sd-id="20">
          <span
            class="text-white/40 text-sm mb-1 uppercase tracking-wider"
            data-sd-id="21"
            >预计到达</span
          >
          <div class="flex items-baseline gap-2" data-sd-id="22">
            <span class="text-3xl font-semibold" data-sd-id="23">15:12</span
            ><span class="text-sm text-white/40" data-sd-id="24">下午</span>
          </div>
        </div>
        <div class="w-[1px] h-10 bg-white/10" data-sd-id="25"></div>
        <div class="flex flex-col" data-sd-id="26">
          <span
            class="text-white/40 text-sm mb-1 uppercase tracking-wider"
            data-sd-id="27"
            >剩余距离</span
          >
          <div class="flex items-baseline gap-2" data-sd-id="28">
            <span class="text-3xl font-semibold" data-sd-id="29">14.2</span
            ><span class="text-sm text-white/40" data-sd-id="30">公里</span>
          </div>
        </div>
        <div class="w-[1px] h-10 bg-white/10" data-sd-id="31"></div>
        <div class="flex flex-col" data-sd-id="32">
          <span
            class="text-white/40 text-sm mb-1 uppercase tracking-wider"
            data-sd-id="33"
            >剩余用时</span
          >
          <div class="flex items-baseline gap-2" data-sd-id="34">
            <span class="text-3xl font-semibold" data-sd-id="35">28</span
            ><span class="text-sm text-white/40" data-sd-id="36">分钟</span>
          </div>
        </div>
      </div>
      <div
        class="absolute left-[1280px] top-[120px] w-[608px] h-[272px] panel p-8 flex flex-col justify-center bg-[#0d1e34]"
        data-sd-id="37"
      >
        <div class="flex items-start gap-6" data-sd-id="38">
          <div
            class="w-24 h-24 flex items-center justify-center bg-blue-500/10 rounded-2xl border border-blue-500/20 text-blue-400"
            data-sd-id="39"
          >
            <iconify-icon
              icon="lucide:arrow-up-right"
              class="text-6xl"
            ></iconify-icon>
          </div>
          <div class="flex-1 flex flex-col justify-center" data-sd-id="40">
            <div class="flex items-baseline gap-2 mb-2" data-sd-id="41">
              <span class="text-5xl font-bold tracking-tight" data-sd-id="42"
                >800</span
              ><span class="text-2xl text-white/40" data-sd-id="43">米</span>
            </div>
            <div class="text-3xl font-semibold leading-tight" data-sd-id="44">
              进入 京沪高速
            </div>
            <div class="text-xl text-white/40 mt-2" data-sd-id="45">
              往 北京 方向
            </div>
          </div>
        </div>
      </div>
      <div
        class="absolute left-[1280px] top-[416px] w-[608px] h-[272px] panel p-8 flex flex-col justify-between bg-[#0d1e34]"
        data-sd-id="46"
      >
        <div class="flex gap-6" data-sd-id="47">
          <div
            class="w-32 h-32 rounded-xl bg-gradient-to-br from-neutral-700 to-neutral-900 border border-white/10 shadow-lg flex items-center justify-center relative group overflow-hidden"
            data-sd-id="48"
          >
            <iconify-icon
              icon="lucide:music"
              class="text-4xl text-white/20 relative z-10"
            ></iconify-icon>
          </div>
          <div class="flex-1 flex flex-col justify-center py-2" data-sd-id="50">
            <h3
              class="text-3xl font-semibold truncate leading-tight"
              data-sd-id="51"
            >
              仪表测试 · 示例歌曲
            </h3>
            <p class="text-xl text-white/50 mt-1 truncate" data-sd-id="52">
              音乐信息来自 iPhone
            </p>
          </div>
        </div>
        <div class="space-y-4" data-sd-id="53">
          <div
            class="flex items-center justify-between text-sm text-white/40 font-mono"
            data-sd-id="54"
          >
            <span id="play-current" data-sd-id="55">01:45</span>
            <div class="text-white/50" data-sd-id="56">
              正在播放
            </div>
            <span data-sd-id="57">04:12</span>
          </div>
          <div
            class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden"
            data-sd-id="58"
          >
            <div
              class="h-full bg-white w-[42%] rounded-full shadow-[0_0_12px_rgba(255,255,255,0.4)]"
              data-sd-id="59"
            ></div>
          </div>
        </div>
      </div>
      <div
        class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-1 opacity-20"
        data-sd-id="60"
      >
        <div class="w-2 h-2 rounded-full bg-white" data-sd-id="61"></div>
        <div class="w-2 h-2 rounded-full bg-white/30" data-sd-id="62"></div>
        <div class="w-2 h-2 rounded-full bg-white/30" data-sd-id="63"></div>
      </div>
      <div
        class="absolute top-[120px] left-[32px] pointer-events-none"
        data-sd-id="64"
      >
        <div
          class="bg-[#C8102E] w-1 h-12 rounded-full shadow-[0_0_15px_rgba(200,16,46,0.6)]"
          data-sd-id="65"
        ></div>
      </div>
    </div>
    <script>
      function updateClock() {
        const now = new Date();
        const clock = document.getElementById("clock");
        clock.textContent =
          now.getHours().toString().padStart(2, "0") +
          ":" +
          now.getMinutes().toString().padStart(2, "0");
      }
      setInterval(updateClock, 1000);
      updateClock();
    </script>
  </body>
</html>
