<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=720">
  <title>DiPlay HS5 · 连接</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    :root {
      --canvas: #071426;
      --card: rgba(16, 31, 51, 0.92);
      --divider: #263c5a;
      --text: #f2f7ff;
      --muted: #8faed5;
      --blue: #087bff;
      --red: #c8102e;
      --green: #34d399;
    }
    body { margin: 0; font-family: -apple-system, "SF Pro Display", "PingFang SC", sans-serif; }
    .dot { width: 10px; height: 10px; border-radius: 999px; background: #34445b; transition: background 0.2s, transform 0.2s; }
    .dot.on { background: var(--blue); box-shadow: 0 0 8px rgba(8, 123, 255, 0.7); }
    .dot.fail { background: var(--red); }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .state-pill { min-height: 52px; min-width: 88px; padding: 0 20px; border-radius: 14px; font-size: 18px; font-weight: 600; }
    .state-pill.active { background: rgba(8, 123, 255, 0.35); color: #fff; border: 1px solid rgba(8, 123, 255, 0.6); }
    .state-pill.idle { color: var(--muted); border: 1px solid transparent; }
    .state-pill.idle:hover { background: rgba(255,255,255,0.06); }
    .action-btn { min-height: 96px; border-radius: 22px; transition: transform 0.15s, background 0.15s; }
    .action-btn:active { transform: scale(0.985); }
    .action-btn:disabled { opacity: 0.45; pointer-events: none; }
  </style>
</head>
<body>
<div id="app-root" class="w-[1920px] h-[720px] box-border flex flex-col bg-[#071426] text-[#f2f7ff] overflow-hidden">
  <header class="shrink-0 h-[96px] flex items-center justify-between px-8 border-b border-[#263c5a]">
    <div class="flex items-center gap-10 h-full">
      <div class="flex items-center gap-3">
        <div class="w-1.5 h-9 bg-[#c8102e] rounded-full"></div>
        <span class="text-[26px] font-semibold">DiPlay <span class="text-[#8faed5] font-normal">HS5</span></span>
      </div>
      <nav class="flex items-center gap-3 h-full py-2">
        <a id="nav-connect" href="#" class="px-8 h-[72px] flex items-center rounded-2xl bg-[#087bff] text-[22px] font-semibold shadow-lg shadow-blue-900/30">连接</a>
        <a id="nav-display" href="#" class="px-8 h-[72px] flex items-center rounded-2xl text-[#8faed5] text-[22px] font-semibold hover:bg-white/5">显示</a>
        <a id="nav-settings" href="#" class="px-8 h-[72px] flex items-center rounded-2xl text-[#8faed5] text-[22px] font-semibold hover:bg-white/5">设置</a>
        <a id="nav-diagnostics" href="#" class="px-8 h-[72px] flex items-center rounded-2xl text-[#8faed5] text-[22px] font-semibold hover:bg-white/5">诊断</a>
        <a id="nav-about" href="#" class="px-8 h-[72px] flex items-center rounded-2xl text-[#8faed5] text-[22px] font-semibold hover:bg-white/5">关于</a>
      </nav>
    </div>
    <span id="clock-label" class="text-[22px] text-[#8faed5] font-medium">14:20</span>
  </header>

  <div id="state-bar" class="shrink-0 flex items-center gap-2 px-8 py-3 border-b border-[#263c5a]/80 bg-[#0a1929]">
    <span class="text-[15px] text-[#8faed5] mr-2 uppercase tracking-wider">演示状态</span>
    <button type="button" id="btn-state-setup" class="state-pill idle">需要设置</button>
    <button type="button" id="btn-state-ready" class="state-pill active">就绪</button>
    <button type="button" id="btn-state-connecting" class="state-pill idle">连接中</button>
    <button type="button" id="btn-state-connected" class="state-pill idle">已连接</button>
    <button type="button" id="btn-state-failed" class="state-pill idle">失败</button>
    <span class="flex-1"></span>
    <button type="button" id="btn-step-early" class="state-pill idle text-[16px] hidden">连接 · 步骤 12</button>
    <button type="button" id="btn-step-late" class="state-pill idle text-[16px] hidden">连接 · 步骤 24</button>
  </div>

  <main class="flex-1 min-h-0 flex gap-8 px-8 py-6">
    <section id="panel-left" class="w-[56%] min-h-0 flex flex-col rounded-[28px] border border-[#263c5a] p-6" style="background: var(--card);">
      <div class="flex items-center gap-3 mb-4">
        <div id="status-dot" class="status-dot w-3.5 h-3.5 rounded-full bg-[#34d399]"></div>
        <span id="status-title" class="text-[22px] font-semibold text-[#34d399]">就绪，随时可连</span>
      </div>
      <h1 id="phone-name" class="text-[44px] font-bold tracking-tight leading-tight mb-2">iPhone 15 Pro</h1>
      <p id="link-line" class="text-[20px] text-[#8faed5] mb-5 hidden">Wi‑Fi Direct · 192.168.49.1</p>

      <div id="setup-banner" class="hidden mb-4 p-4 rounded-2xl border border-[#c8102e]/50 bg-[#c8102e]/10">
        <p class="text-[20px] font-semibold text-[#fca5a5]">连接前请先完成设置</p>
        <p class="text-[17px] text-[#8faed5] mt-1">请在设置中授予蓝牙与位置权限，并选择无线连接方式。</p>
      </div>

      <div id="fail-banner" class="hidden mb-4 p-4 rounded-2xl border border-[#c8102e]/50 bg-[#c8102e]/10">
        <p class="text-[20px] font-semibold text-[#fca5a5]">连接失败</p>
        <p id="fail-detail" class="text-[17px] text-[#8faed5] mt-1">在「等待 AirPlay 数据通道…」步骤超时，请重试。</p>
      </div>

      <button type="button" id="row-method" class="flex items-center justify-between w-full h-[72px] px-5 rounded-2xl bg-white/5 mb-4 text-left">
        <div class="flex items-center gap-4">
          <iconify-icon icon="lucide:radio" class="text-3xl text-[#087bff]"></iconify-icon>
          <div>
            <div class="text-[18px] font-semibold">连接方式</div>
            <div id="method-label" class="text-[16px] text-[#8faed5]">Wi‑Fi Direct</div>
          </div>
        </div>
        <iconify-icon icon="lucide:chevron-right" class="text-2xl text-[#8faed5]"></iconify-icon>
      </button>

      <div id="progress-block" class="flex-1 min-h-0 flex flex-col rounded-2xl bg-black/20 p-4 mb-4">
        <div class="flex items-center justify-between mb-3">
          <span class="text-[17px] font-semibold text-[#8faed5]">连接进度</span>
          <span id="progress-counter" class="text-[15px] text-[#8faed5]">0 / 27</span>
        </div>
        <div id="dots-grid" class="grid grid-cols-9 gap-x-2 gap-y-2 mb-4"></div>
        <p id="step-label" class="text-[22px] font-semibold leading-snug text-white min-h-[3rem]">点右侧「进入 CarPlay」开始连接</p>
      </div>

      <div class="flex items-center justify-between h-[76px] px-5 rounded-2xl bg-white/5 shrink-0">
        <div class="flex items-center gap-4">
          <iconify-icon icon="lucide:map-pin" class="text-3xl text-[#34d399]"></iconify-icon>
          <div>
            <div class="text-[18px] font-semibold">向 iPhone 报告位置</div>
            <div class="text-[15px] text-[#8faed5]">导航与 CarPlay 位置同步</div>
          </div>
        </div>
        <button type="button" id="toggle-location" aria-pressed="true" class="w-[72px] h-[40px] rounded-full bg-[#087bff] flex items-center px-1">
          <span class="w-[34px] h-[34px] bg-white rounded-full shadow ml-auto"></span>
        </button>
      </div>
    </section>

    <section id="panel-right" class="w-[44%] min-h-0 flex flex-col gap-4 py-1">
      <button type="button" id="action-carplay" class="action-btn flex-1 flex items-center justify-between px-8 bg-[#087bff] hover:bg-[#1a88ff] shadow-xl shadow-blue-900/25">
        <div class="flex items-center gap-5">
          <iconify-icon icon="simple-icons:apple" class="text-[48px]"></iconify-icon>
          <span id="carplay-title" class="text-[32px] font-bold">进入 CarPlay</span>
        </div>
        <iconify-icon icon="lucide:chevron-right" class="text-4xl opacity-60"></iconify-icon>
      </button>
      <button type="button" id="action-switch" class="action-btn flex-1 flex items-center justify-between px-8 bg-white/5 border border-[#263c5a] hover:bg-white/10">
        <div class="flex items-center gap-5">
          <iconify-icon icon="lucide:smartphone" class="text-[36px] text-[#087bff]"></iconify-icon>
          <div class="text-left">
            <div class="text-[26px] font-semibold">切换 iPhone</div>
            <div class="text-[16px] text-[#8faed5]">选择已配对的手机</div>
          </div>
        </div>
        <iconify-icon icon="lucide:chevron-right" class="text-3xl text-[#8faed5]"></iconify-icon>
      </button>
      <button type="button" id="action-disconnect" class="action-btn flex-1 flex items-center justify-between px-8 bg-white/5 border border-[#263c5a] hover:bg-white/10">
        <div class="flex items-center gap-5">
          <iconify-icon icon="lucide:unplug" class="text-[36px] text-[#f87171]"></iconify-icon>
          <div class="text-left">
            <div class="text-[26px] font-semibold text-[#fca5a5]">断开连接</div>
            <div class="text-[16px] text-[#8faed5]">结束当前 CarPlay 会话</div>
          </div>
        </div>
        <iconify-icon icon="lucide:chevron-right" class="text-3xl text-[#8faed5]"></iconify-icon>
      </button>
    </section>
  </main>
</div>
<script>
(function () {
  var STEPS = [
    "准备连接…", "启动配件认证", "等待认证模块", "请求认证权限", "认证就绪",
    "启动车载无线网络", "无线网络与蓝牙就绪", "获取网络地址", "选择 USB 配置", "启动传输服务",
    "启动网络发现", "选择 iPhone", "连接蓝牙控制通道", "蓝牙已连接", "打开控制通道",
    "启动协议握手", "向 iPhone 标识配件", "与 iPhone 认证", "同步服务订阅", "iPhone 请求 Wi‑Fi 信息",
    "发送 Wi‑Fi 信息给 iPhone", "收到手机就绪状态", "请求 iPhone 加入热点", "iPhone 正在更新 Wi‑Fi",
    "等待 AirPlay 数据通道…", "等待 AirPlay 数据通道…", "等待 AirPlay 数据连接…", "正在准备画面"
  ];
  var state = "ready";
  var connectStep = 12;
  var dotsEl = document.getElementById("dots-grid");
  for (var i = 0; i < 27; i++) {
    var d = document.createElement("div");
    d.className = "dot";
    d.dataset.index = String(i);
    dotsEl.appendChild(d);
  }
  function setActivePill(id) {
    ["btn-state-setup", "btn-state-ready", "btn-state-connecting", "btn-state-connected", "btn-state-failed"].forEach(function (bid) {
      var el = document.getElementById(bid);
      el.classList.toggle("active", bid === id);
      el.classList.toggle("idle", bid !== id);
    });
  }
  function renderDots(filled, failedAt) {
    var dots = dotsEl.querySelectorAll(".dot");
    dots.forEach(function (dot, idx) {
      dot.classList.remove("on", "fail", "pulse");
      if (idx < filled) dot.classList.add("on");
      if (failedAt !== null && idx === failedAt) dot.classList.add("fail");
      if (state === "connecting" && idx === filled && filled < 27) dot.classList.add("pulse", "on");
    });
    document.getElementById("progress-counter").textContent = filled + " / 27";
  }
  function applyState() {
    var setup = document.getElementById("setup-banner");
    var fail = document.getElementById("fail-banner");
    var link = document.getElementById("link-line");
    var dot = document.getElementById("status-dot");
    var title = document.getElementById("status-title");
    var step = document.getElementById("step-label");
    var carplay = document.getElementById("action-carplay");
    var carplayTitle = document.getElementById("carplay-title");
    var disconnect = document.getElementById("action-disconnect");
    var early = document.getElementById("btn-step-early");
    var late = document.getElementById("btn-step-late");
    setup.classList.add("hidden");
    fail.classList.add("hidden");
    link.classList.add("hidden");
    early.classList.add("hidden");
    late.classList.add("hidden");
    carplay.disabled = false;
    disconnect.disabled = true;
    if (state === "setup") {
      setActivePill("btn-state-setup");
      dot.className = "w-3.5 h-3.5 rounded-full bg-amber-400";
      title.textContent = "需要设置";
      title.className = "text-[22px] font-semibold text-amber-300";
      setup.classList.remove("hidden");
      step.textContent = "完成设置后即可连接 iPhone";
      renderDots(0, null);
      carplay.disabled = true;
      carplayTitle.textContent = "进入 CarPlay";
    } else if (state === "ready") {
      setActivePill("btn-state-ready");
      dot.className = "w-3.5 h-3.5 rounded-full bg-[#34d399]";
      title.textContent = "就绪，随时可连";
      title.className = "text-[22px] font-semibold text-[#34d399]";
      step.textContent = "点右侧「进入 CarPlay」开始连接";
      renderDots(0, null);
      carplayTitle.textContent = "进入 CarPlay";
    } else if (state === "connecting") {
      setActivePill("btn-state-connecting");
      early.classList.remove("hidden");
      late.classList.remove("hidden");
      dot.className = "w-3.5 h-3.5 rounded-full bg-[#087bff] pulse";
      title.textContent = "正在连接 iPhone…";
      title.className = "text-[22px] font-semibold text-[#60a5fa]";
      link.classList.remove("hidden");
      step.textContent = STEPS[connectStep] || STEPS[0];
      renderDots(connectStep + 1, null);
      carplay.disabled = true;
      carplayTitle.textContent = "连接中…";
      disconnect.disabled = false;
    } else if (state === "connected") {
      setActivePill("btn-state-connected");
      dot.className = "w-3.5 h-3.5 rounded-full bg-[#34d399]";
      title.textContent = "CarPlay 已连接";
      title.className = "text-[22px] font-semibold text-[#34d399]";
      link.classList.remove("hidden");
      step.textContent = "连接完成 · 正在准备画面";
      renderDots(27, null);
      carplayTitle.textContent = "打开 CarPlay";
      disconnect.disabled = false;
    } else if (state === "failed") {
      setActivePill("btn-state-failed");
      dot.className = "w-3.5 h-3.5 rounded-full bg-[#c8102e]";
      title.textContent = "连接失败";
      title.className = "text-[22px] font-semibold text-[#fca5a5]";
      fail.classList.remove("hidden");
      link.classList.remove("hidden");
      step.textContent = STEPS[24];
      renderDots(24, 24);
      carplayTitle.textContent = "重试连接";
      disconnect.disabled = false;
    }
  }
  document.getElementById("btn-state-setup").onclick = function () { state = "setup"; applyState(); };
  document.getElementById("btn-state-ready").onclick = function () { state = "ready"; applyState(); };
  document.getElementById("btn-state-connecting").onclick = function () { state = "connecting"; connectStep = 12; applyState(); };
  document.getElementById("btn-state-connected").onclick = function () { state = "connected"; applyState(); };
  document.getElementById("btn-state-failed").onclick = function () { state = "failed"; applyState(); };
  document.getElementById("btn-step-early").onclick = function () { state = "connecting"; connectStep = 12; applyState(); };
  document.getElementById("btn-step-late").onclick = function () { state = "connecting"; connectStep = 24; applyState(); };
  applyState();
})();
</script>
</body>
</html>
